[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "agentool"
version = "0.1.0"
description = "Universal API Translator and MCP Server for AI agents."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [
    { name = "Samvardhan Singh" },
    { name = "Muskan Gujar" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries",
]
dependencies = []

[project.optional-dependencies]
agentid = ["agentidentity-auth>=0.1.0"]
agentmem = ["agentmem>=0.1.0"]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "agentool[agentid]",
    "agentool[agentmem]",
]

[project.scripts]
agentool = "agentool.cli_entry:main"

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "agentool._native"
python-source = "."
manifest-path = "Cargo.toml"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
