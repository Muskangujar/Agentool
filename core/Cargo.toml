[package]
name         = "agentool-core"
version      = "0.1.0"
edition      = "2021"
rust-version = "1.75"

[lib]
name       = "agentool_core"
crate-type = ["rlib", "cdylib"]   # cdylib so the Python maturin crate can link it

[[bin]]
name = "agentool-server"
path = "src/bin/agentool_server.rs"

[dependencies]
# ── async runtime + HTTP server ──────────────────────────────────────────────
tokio          = { version = "1.36", features = ["full"] }
hyper          = { version = "1.2",  features = ["http1", "http2", "server"] }
hyper-util     = { version = "0.1",  features = ["tokio"] }
http-body-util = "0.1"
tower          = { version = "0.4",  features = ["limit", "timeout", "util"] }

# ── outbound HTTP (upstream API calls) ───────────────────────────────────────
reqwest  = { version = "0.12", default-features = false,
             features = ["rustls-tls", "json", "stream", "gzip", "brotli"] }
url      = "2.5"

# ── serialization ────────────────────────────────────────────────────────────
serde           = { version = "1.0", features = ["derive"] }
serde_json      = { version = "1.0", features = ["preserve_order"] }
serde-json-core = { version = "0.5", default-features = false }
struson         = "0.5"   # streaming JSON reader; avoids full allocation on large specs

# ── error handling ───────────────────────────────────────────────────────────
thiserror = "1.0"
anyhow    = "1.0"   # only inside bin/ — never in library code

# ── concurrency primitives ───────────────────────────────────────────────────
parking_lot = "0.12"
dashmap     = "5.5"   # per-tool rate-limit and circuit-breaker state

# ── rate limit + retry ───────────────────────────────────────────────────────
governor = "0.6"                              # clock-injectable token bucket
backoff  = { version = "0.4", features = ["tokio"] }

# ── observability ────────────────────────────────────────────────────────────
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# ── C++ bridge ───────────────────────────────────────────────────────────────
cxx = "1.0"

# ── PyO3 surface (S2) ────────────────────────────────────────────────────────
pyo3 = { version = "0.21", features = ["extension-module", "abi3-py38"] }

# ── utility ──────────────────────────────────────────────────────────────────
bytes     = "1.5"
once_cell = "1.19"
uuid      = { version = "1.7", features = ["v4"] }
chrono    = { version = "0.4", features = ["serde"] }

[build-dependencies]
cxx-build  = "1.0"
pkg-config = "0.3"   # locates libxml2

[dev-dependencies]
tokio             = { version = "1.36", features = ["full", "test-util"] }
wiremock          = "0.6"
tempfile          = "3"
insta             = { version = "1.36", features = ["json"] }
pretty_assertions = "1"
